site_name: QPPTE
theme:
  name: material
  palette:
    primary: amber
  logo:
    images/typewriter.png
  features:
    - navigation.sections

# Markdown extensions
markdown_extensions:
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - "Introduction": "index.md"
  - "Features": "features.md"
  - "Embedding": "embedding.md"
  - "Adding Styles": "styles.md"
  - "Extending": "extending.md"